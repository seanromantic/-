<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SAMARRA · 聊天室</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f5f7fb;
      color: #1e293b;
      padding: 24px 16px;
    }
    .topbar {
      width: 100%;
      max-width: 320px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .back {
      color: #5b8cff;
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid #dbe3f0;
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
    }
    .status { font-size: 12px; color: #94a3b8; }
    .chat-box {
      width: 100%;
      max-width: 320px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      min-height: 300px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    #messages {
      list-style: none;
      padding: 0;
      flex: 1;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    #messages li {
      margin-bottom: 8px;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
      color: #334155;
    }
    #messages li .sender { color: #5b8cff; font-weight: 600; margin-right: 4px; }
    .input-bar {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 320px;
    }
    input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #dbe3f0;
      border-radius: 10px;
      background: #fff;
      color: #1e293b;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #5b8cff; }
    button {
      padding: 10px 18px;
      background: linear-gradient(90deg, #5b8cff, #8e6bff);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← 返回</a>
    <span class="status" id="status">初始化</span>
  </div>

  <div class="chat-box">
    <ul id="messages"></ul>
  </div>
  <div class="input-bar">
    <input id="msg" placeholder="说点什么..." onkeypress="if(event.key==='Enter'){sendMsg();}" />
    <button onclick="sendMsg()">发送</button>
  </div>

  <script>
    if (typeof supabase === 'undefined') {
      document.getElementById('status').innerText = 'SDK 加载失败';
      throw new Error('SDK not loaded');
    }

    var SUPABASE_URL = 'https://djvsugbstenltenktpwv.supabase.co';
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqdnN1Z2JzdGVubHRlbmt0cHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2OTI0MDcsImV4cCI6MjEwNzI2ODQwN30.XMBE7NCridZ34BG7LyRiHQRZP0SkVI209uQhqSgcIAs';

    var myName = null;
    try {
      myName = localStorage.getItem('myName');
      if (!myName) {
        myName = '玩家' + Math.floor(Math.random() * 9000 + 1000);
        localStorage.setItem('myName', myName);
      }
    } catch (e) {
      myName = '玩家' + Math.floor(Math.random() * 9000 + 1000);
    }

    var client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    var channel = null;

    function step1_loadHistory() {
      document.getElementById('status').innerText = '正在加载历史记录';
      client.from('messages').select('*').eq('room', 'public')
        .order('created_at', { ascending: true }).limit(100)
        .then(function (res) {
          if (res.error) {
            document.getElementById('status').innerText = '历史记录加载失败：' + res.error.message;
            return;
          }
          if (res.data && res.data.length > 0) {
            res.data.forEach(function (m) {
              var isMine = (m.name === myName);
              addMessage(m.name || '匿名', m.text || '', isMine);
            });
          }
          document.getElementById('status').innerText = '已加载 ' + (res.data ? res.data.length : 0) + ' 条历史记录';
          step2_connect();
        })
        .catch(function (e) {
          document.getElementById('status').innerText = '历史记录加载异常：' + e.message;
        });
    }

    function step2_connect() {
      document.getElementById('status').innerText = '正在建立实时连接';
      channel = client.channel('room:public', {
        config: { broadcast: { self: false, ack: true } }
      });

      channel.subscribe(function (status, err) {
        if (status === 'SUBSCRIBED') {
          document.getElementById('status').innerText = '实时连接已建立';
          step3_bindEvents();
        } else if (status === 'CHANNEL_ERROR') {
          document.getElementById('status').innerText = '实时连接被拒绝';
      } else if (status === 'TIMED_OUT') {
          document.getElementById('status').innerText = '实时连接超时';
        } else {
          document.getElementById('status').innerText = '连接状态：' + status;
        }
      });
    }

    function step3_bindEvents() {
      channel.on('broadcast', { event: 'chat' }, function (payload) {
        addMessage(payload.payload.name, payload.payload.text, false);
      });
    }

    function addMessage(name, text, isMine) {
      if (!text) return;
      var li = document.createElement('li');
      var displayName = isMine ? name + '（我）' : name;
      li.innerHTML = '<span class="sender">' + displayName + '：</span>' + text;
      document.getElementById('messages').appendChild(li);
      var box = document.getElementById('messages');
      box.scrollTop = box.scrollHeight;
    }

    function sendMsg() {
      var text = document.getElementById('msg').value;
      if (!text || !channel) return;

      document.getElementById('status').innerText = '正在保存消息';

      client.from('messages').insert({
        name: myName,
        text: text,
        room: 'public'
      }).then(function (res) {
        if (res.error) {
          document.getElementById('status').innerText = '消息持久化失败：' + res.error.message;
          return;
        }

        document.getElementById('status').innerText = '实时连接已建立';

        channel.send({
          type: 'broadcast',
          event: 'chat',
          payload: { name: myName, text: text }
        });

        addMessage(myName, text, true);

        document.getElementById('msg').value = '';
      });
    }

    window.onload = function () {
      step1_loadHistory();
    };
  </script>
</body>
</html>
