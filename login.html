<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SAMARRA · 登录</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="shared/common.css">
<style>
  body { justify-content: center; }
  .card-box {
    width: 100%;
    max-width: 320px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 20px;
    padding: 32px 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    margin-top: 60px;
  }
  h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #5b8cff, #8e6bff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
    margin-bottom: 6px;
  }
  .sub { text-align: center; font-size: 12px; color: #94a3b8; margin-bottom: 24px; }
  label { display: block; font-size: 12px; color: #78716c; margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid #e2e8f0; background: #fff; color: #1e293b;
    font-size: 14px; outline: none; margin-bottom: 14px;
  }
  input:focus { border-color: #5b8cff; box-shadow: 0 0 0 3px rgba(91,140,255,0.1); }
  .msg { font-size: 12px; color: #ef4444; text-align: center; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>

<div class="card-box anim-up">
  <h1>SAMARRA</h1>
  <p class="sub">填写你的信息</p>

  <label>真实姓名</label>
  <input id="realName" placeholder="填入白名单里的名字" />

  <label>昵称</label>
  <input id="nickname" placeholder="起个好记的昵称" />

  <button class="btn-pill btn-primary" style="width:100%;" onclick="doLogin()">进入</button>
  <p class="msg" id="msg"></p>
</div>

<script src="shared/config.js"></script>
<script src="shared/user.js"></script>
<script>
if (typeof supabase === 'undefined') {
  document.getElementById('msg').innerText = 'SDK 加载失败，请刷新';
  throw new Error('SDK not loaded');
}

var client = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);

// 已登录，直接按身份跳
if (User.isLoggedIn()) {
  if (User.isAdmin()) location.replace('admin.html');
  else location.replace('index.html');
}

function doLogin() {
  var realName = document.getElementById('realName').value.trim();
  var nickname = document.getElementById('nickname').value.trim();
  var msgEl = document.getElementById('msg');

  if (!realName) { msgEl.innerText = '请填写真实姓名'; return; }
  if (!nickname) { msgEl.innerText = '请输入昵称'; return; }

  msgEl.style.color = '#94a3b8';
  msgEl.innerText = '正在验证...';

  client.from('users').select('*').eq('real_name', realName).then(function (res) {
    if (res.error) {
      msgEl.style.color = '#ef4444';
      msgEl.innerText = '验证失败，请重试';
      return;
    }
    if (!res.data || res.data.length === 0) {
      msgEl.style.color = '#ef4444';
      msgEl.innerText = '不在白名单，请联系管理员';
      return;
    }

    var user = res.data[0];
    var today = new Date();
    var todayStr = today.getFullYear() + '-' +
      (today.getMonth() + 1).toString().padStart(2, '0') + '-' +
      today.getDate().toString().padStart(2, '0');

    // 数据库里 total_days 为 0 表示第一次登录
    var totalDays = user.total_days || 0;
    var isNewDay = true;  // 简化：新设备登录也算新的一天

    // 本地已登录过且今天已算过，不再 +1
    var localUser = User.get();
    if (localUser && localUser.realName === realName && localUser.lastLoginDate === todayStr) {
      isNewDay = false;
      totalDays = localUser.totalDays || totalDays;
    } else {
      totalDays = totalDays + 1;
    }

    if (!User.login(realName, nickname, totalDays)) {
      msgEl.style.color = '#ef4444';
      msgEl.innerText = '本地存储不可用';
      return;
    }

    // 写回数据库
    client.from('users').update({
      nickname: nickname,
      total_days: totalDays
    }).eq('real_name', realName).then(function () {
      if (realName === CONFIG.ADMIN_NAME) location.href = 'admin.html';
      else location.href = 'index.html';
    });
  });
}
</script>
</body>
</html>
