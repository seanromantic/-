<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 · SAMARRA</title>
<link rel="stylesheet" href="shared/common.css">
<style>
  .mega { padding: 26px; display: flex; align-items: center; gap: 18px; cursor: pointer;
    transition: transform .15s, box-shadow .15s; text-decoration: none; color: var(--ink); }
  .mega:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,0,0,.12); }
  .mega .ic { font-size: 40px; }
  .mega h3 { font-size: 18px; }
  .mega p { color: var(--muted); font-size: 13px; margin-top: 4px; }
</style>
</head>
<body>
<canvas class="fx-layer" id="fx"></canvas>
<div class="toast-wrap" id="toasts"></div>

<header class="topbar">
  <div class="brand">SAMARRA · 管理后台</div>
  <div class="who">
    <span id="nickLabel">—</span>
    <a class="btn btn-sm btn-ghost" href="index.html">返回大厅</a>
  </div>
</header>

<div class="container">
  <a class="card mega" href="admin/story-editor.html" style="max-width:640px">
    <div class="ic">📖</div>
    <div>
      <h3>文字游戏编辑器</h3>
      <p>可视化思维导图：拖拽连线、编辑节点文字与选项、实时保存至 story_nodes 表</p>
    </div>
  </a>

  <div class="divider"></div>

  <div class="row-between">
    <h3>故事列表</h3>
    <div class="row">
      <input class="input" id="newStoryTitle" placeholder="新故事标题" style="width:200px">
      <button class="btn btn-primary btn-sm" id="newStoryBtn">新建故事</button>
    </div>
  </div>
  <div class="admin-list mt-16" id="storyList"></div>
</div>

<script>
/* ============ 轻量 Supabase REST 封装 ============ */
/* 环境配置：优先 URL 参数（存入 sessionStorage 供跳转后使用），其次全局注入，最后内置默认值 */
(function () {
  try {
    const p = new URLSearchParams(location.search);
    if (p.get("sburl")) sessionStorage.setItem("samarra_cfg", JSON.stringify({ url: p.get("sburl"), key: p.get("sbkey") || "test-key" }));
  } catch (e) {}
})();
const SB_CFG = (function () { try { const s = sessionStorage.getItem("samarra_cfg"); return s ? JSON.parse(s) : null; } catch (e) { return null; } })();
const SB = {
  url: (SB_CFG && SB_CFG.url) || (window.SAMARRA_CONFIG && SAMARRA_CONFIG.url) || "https://djvsugbstenltenktpwv.supabase.co",
  key: (SB_CFG && SB_CFG.key) || (window.SAMARRA_CONFIG && SAMARRA_CONFIG.key) || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqdnN1Z2JzdGVubHRlbmt0cHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2OTI0MDcsImV4cCI6MjEwNzI2ODQ0N30.XMBE7NCridZ34BG7LyRiHQRZP0SkVI209uQhqSgcIAs",
  async rpc(fn, body) {
    const r = await fetch(this.url + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": this.key, "Authorization": "Bearer " + this.key, "Prefer": "return=representation" },
      body: JSON.stringify(body || {})
    });
    if (!r.ok) {
      let t = ""; try { t = (await r.json()).message || ""; } catch (e) {}
      if (!t) { try { t = await r.text(); } catch (e2) {} }
      throw new Error((t || ("HTTP " + r.status)).slice(0, 160));
    }
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  }
};

/* ============ 粒子 ============ */
(function () {
  const MAX = 60, BURST = 12;
  const cv = document.getElementById("fx");
  const ctx = cv.getContext("2d");
  let parts = [], W = 0, H = 0;
  function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  resize(); addEventListener("resize", resize);
  addEventListener("click", function (e) {
    for (let i = 0; i < BURST; i++) {
      if (parts.length >= MAX) parts.shift();
      const a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 160;
      parts.push({ x: e.clientX, y: e.clientY, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60,
        life: 1, size: 2 + Math.random() * 3.5,
        color: ["#4f46e5", "#7c3aed", "#f59e0b", "#10b981", "#ef4444"][(Math.random() * 5) | 0] });
    }
  });
  (function loop() {
    ctx.clearRect(0, 0, W, H);
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.x += p.vx * 0.016; p.y += p.vy * 0.016; p.vy += 260 * 0.016; p.life -= 0.025;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  })();
})();

/* ============ 鉴权拦截 ============ */
const NICK_KEY = "samarra_nickname";
const nickname = (localStorage.getItem(NICK_KEY) || "").trim();

function toast(msg, type) {
  const w = document.getElementById("toasts");
  const t = document.createElement("div");
  t.className = "toast" + (type ? " " + type : "");
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

async function guard() {
  if (!nickname) { location.replace("../login.html"); return false; }
  document.getElementById("nickLabel").textContent = nickname;
  try {
    const ok = await SB.rpc("is_admin", { p_nickname: nickname });
    if (!ok) {
      toast("无管理员权限，已拦截", "err");
      setTimeout(() => location.replace("index.html"), 900);
      return false;
    }
    return true;
  } catch (e) {
    toast("鉴权失败，已跳回大厅", "err");
    setTimeout(() => location.replace("index.html"), 900);
    return false;
  }
}

/* ============ 故事列表 ============ */
async function loadStories() {
  const list = document.getElementById("storyList");
  list.innerHTML = "";
  try {
    const rows = await SB.rpc("list_stories", {});
    if (!rows || !rows.length) {
      list.innerHTML = '<div class="card muted" style="text-align:center">还没有故事，先新建一个吧</div>';
      return;
    }
    rows.forEach(s => {
      const d = document.createElement("div");
      d.className = "admin-item pop-in";
      d.innerHTML = '<div class="t">📖 ' + escapeHtml(s.title) + '</div>' +
        '<div class="row"><span class="muted" style="font-size:13px">' + (s.node_count || 0) + ' 个节点</span>' +
        '<button class="btn btn-primary btn-sm" data-act="edit" data-id="' + s.id + '">编辑</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="del" data-id="' + s.id + '">删除</button></div>';
      list.appendChild(d);
    });
  } catch (e) { list.innerHTML = '<div class="card muted" style="text-align:center">加载失败：' + escapeHtml(e.message) + '</div>'; }
}

document.getElementById("storyList").addEventListener("click", e => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const id = btn.dataset.id, act = btn.dataset.act;
  if (act === "edit") location.href = "admin/story-editor.html?story=" + id;
  if (act === "del") {
    if (!confirm("确定删除该故事及其全部节点？")) return;
    SB.rpc("delete_story", { p_story_id: parseInt(id, 10) })
      .then(() => { toast("已删除", "ok"); loadStories(); })
      .catch(err => toast(err.message, "err"));
  }
});

document.getElementById("newStoryBtn").addEventListener("click", async () => {
  const title = (document.getElementById("newStoryTitle").value || "").trim();
  if (!title) { toast("请输入标题", "err"); return; }
  try {
    const s = await SB.rpc("create_story", { p_title: title });
    location.href = "admin/story-editor.html?story=" + s.id;
  } catch (e) { toast(e.message, "err"); }
});

/* ============ 启动 ============ */
guard().then(ok => { if (ok) loadStories(); });

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
</script>
</body>
</html>
