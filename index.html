<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SAMARRA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      /* 奶白色背景 */
      background: #faf8f5;
      color: #1e293b;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 4px;
      background: linear-gradient(90deg, #5b8cff, #8e6bff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    header p {
      font-size: 12px;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 10vw;
      min-width: 80px;
      max-width: 120px;
    }

    .card {
      width: 100%;
      aspect-ratio: 1.618 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;

      background: #fff;
      border: 1px solid #ebe5dc;
      border-radius: 8px;

      cursor: pointer;
      transition: border-color 0.3s, box-shadow 0.3s, transform 0.2s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #c7d2fe;
      box-shadow: 0 6px 18px rgba(91,140,255,0.15);
    }

    .card .icon {
      font-size: 22px;
      line-height: 1;
    }

    .card .name {
      position: absolute;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      color: #94a3b8;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .card.disabled {
      cursor: not-allowed;
      pointer-events: none;
      background: #fdfcfa;
      border-color: #f0ebe3;
    }

    .card.disabled .icon {
      color: #ef4444;
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 11px;
      color: #a8a29e;
      letter-spacing: 0.5px;
      line-height: 1.8;
    }

    footer .brand {
      display: block;
      font-size: 12px;
      color: #78716c;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <header>
    <h1>SAMARRA</h1>
    <p>选一个游戏，和好友一起玩</p>
  </header>

  <div class="list">
    <div class="card" onclick="location.href='chat.html'">
      <span class="icon">💬</span>
      <span class="name">聊天室</span>
    </div>

    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
  </div>

  <footer>
    <span class="brand">© 2026 SAMARRA</span>
    —— Small x 与 Sean 联合发布
  </footer>

</body>
</html>
