<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大厅 · SAMARRA</title>
<link rel="stylesheet" href="shared/common.css">
<style>
  .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .game-tile { text-align: left; cursor: pointer; transition: transform .15s, box-shadow .15s; }
  .game-tile:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(0,0,0,.10); }
  .game-tile .icon { font-size: 34px; margin-bottom: 8px; }
  .game-tile h3 { font-size: 17px; margin-bottom: 4px; }
  .game-tile p { font-size: 13px; color: var(--muted); }
  .room-view { display: none; }
  .room-code-big { font-size: 30px; font-weight: 900; letter-spacing: 6px; color: var(--brand); }
  .lobby-view { display: none; }
  .copy-hint { font-size: 12px; color: var(--muted); }
  @media (max-width: 720px) { .game-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<canvas class="fx-layer" id="fx"></canvas>
<div class="toast-wrap" id="toasts"></div>

<header class="topbar">
  <div class="brand">SAMARRA</div>
  <div class="who">
    <span id="nickLabel">—</span>
    <a class="btn btn-sm btn-ghost" id="adminBtn" href="admin.html" style="display:none">管理后台</a>
    <button class="btn btn-sm btn-ghost" id="logout">退出登录</button>
  </div>
</header>

<div class="container">

  <!-- 大厅视图：创建 / 加入房间 -->
  <section id="lobbyView" class="lobby-view">
    <h2 style="margin-bottom:14px">选择玩法</h2>
    <div class="game-grid">
      <div class="card game-tile" id="tileDoudizhu">
        <div class="icon">🃏</div>
        <h3>斗地主</h3>
        <p>2 人单挑 / 3 人经典 / 4 人两副牌，叫地主、出牌全自动校验</p>
      </div>
      <div class="card game-tile" id="tileStory">
        <div class="icon">📖</div>
        <h3>文字冒险</h3>
        <p>剧情节点选择，存档绑定昵称，随时继续冒险</p>
      </div>
    </div>

    <div class="divider"></div>

    <div class="card" id="createCard" style="max-width:560px">
      <h3 style="margin-bottom:14px">创建斗地主房间</h3>
      <div class="field">
        <label>人数模式</label>
        <div class="chip-group">
          <div class="chip active" data-n="2">👥 2 人单挑</div>
          <div class="chip" data-n="3">🃏 3 人经典</div>
          <div class="chip" data-n="4">🃏🃏 4 人两副牌</div>
        </div>
      </div>
      <button class="btn btn-primary btn-lg" id="createBtn" style="width:100%">创建房间</button>
    </div>

    <div class="card mt-16" style="max-width:560px">
      <h3 style="margin-bottom:14px">加入房间</h3>
      <div class="field">
        <label>房间号</label>
        <input class="input" id="joinCode" maxlength="6" placeholder="输入 6 位房间号" autocomplete="off" style="text-transform:uppercase">
      </div>
      <button class="btn btn-lg" id="joinBtn" style="width:100%">加入房间</button>
    </div>
  </section>

  <!-- 房间视图：座位展示 -->
  <section id="roomView" class="room-view">
    <div class="row-between card" style="margin-bottom:18px">
      <div>
        <div class="room-code-big" id="roomCode">——</div>
        <div class="copy-hint">把房间号发给朋友加入</div>
      </div>
      <div id="roomStatus" class="muted" style="font-weight:700">等待加入…</div>
    </div>

    <div class="card">
      <div class="seats" id="seats"></div>
      <div class="row-between" style="margin-top:8px">
        <button class="btn btn-danger" id="leaveBtn">退出房间</button>
        <button class="btn btn-ok btn-lg" id="startBtn" style="display:none">开始游戏</button>
        <div class="muted" id="waitHint" style="display:none">等待房主开始游戏…</div>
      </div>
    </div>
  </section>

</div>

<script>
/* ============ 轻量 Supabase REST 封装（零外部依赖） ============ */
/* 环境配置：优先 URL 参数（存入 sessionStorage 供跳转后使用），其次全局注入，最后内置默认值 */
(function () {
  try {
    const p = new URLSearchParams(location.search);
    if (p.get("sburl")) sessionStorage.setItem("samarra_cfg", JSON.stringify({ url: p.get("sburl"), key: p.get("sbkey") || "test-key" }));
  } catch (e) {}
})();
const SB_CFG = (function () { try { const s = sessionStorage.getItem("samarra_cfg"); return s ? JSON.parse(s) : null; } catch (e) { return null; } })();
const SB = {
  url: (SB_CFG && SB_CFG.url) || (window.SAMARRA_CONFIG && SAMARRA_CONFIG.url) || "https://djvsugbstenltenktpwv.supabase.co",
  key: (SB_CFG && SB_CFG.key) || (window.SAMARRA_CONFIG && SAMARRA_CONFIG.key) || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqdnN1Z2JzdGVubHRlbmt0cHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2OTI0MDcsImV4cCI6MjEwNzI2ODQ0N30.XMBE7NCridZ34BG7LyRiHQRZP0SkVI209uQhqSgcIAs",
  async rpc(fn, body) {
    const r = await fetch(this.url + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": this.key, "Authorization": "Bearer " + this.key, "Prefer": "return=representation" },
      body: JSON.stringify(body || {})
    });
    if (!r.ok) {
      let t = ""; try { t = (await r.json()).message || ""; } catch (e) {}
      if (!t) { try { t = await r.text(); } catch (e2) {} }
      throw new Error((t || ("HTTP " + r.status)).slice(0, 160));
    }
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  }
};

/* ============ 全站点击粒子动效（限量防卡顿） ============ */
(function () {
  const MAX = 60, BURST = 12;
  const cv = document.getElementById("fx");
  const ctx = cv.getContext("2d");
  let parts = [], W = 0, H = 0;
  function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  resize(); addEventListener("resize", resize);
  addEventListener("click", function (e) {
    for (let i = 0; i < BURST; i++) {
      if (parts.length >= MAX) parts.shift();
      const a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 160;
      parts.push({ x: e.clientX, y: e.clientY, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60,
        life: 1, size: 2 + Math.random() * 3.5,
        color: ["#4f46e5", "#7c3aed", "#f59e0b", "#10b981", "#ef4444"][(Math.random() * 5) | 0] });
    }
  });
  (function loop() {
    ctx.clearRect(0, 0, W, H);
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.x += p.vx * 0.016; p.y += p.vy * 0.016; p.vy += 260 * 0.016; p.life -= 0.025;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  })();
})();

/* ============ 工具 ============ */
const NICK_KEY = "samarra_nickname";
const ROOM_KEY = "samarra_room";
let nickname = (localStorage.getItem(NICK_KEY) || "").trim();
let roomCode = sessionStorage.getItem(ROOM_KEY) || "";
let mySeat = -1;
let pollTimer = null;

function toast(msg, type) {
  const w = document.getElementById("toasts");
  const t = document.createElement("div");
  t.className = "toast" + (type ? " " + type : "");
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

/* 昵称 → 等级（1~10 确定性映射，未来可接真实等级系统） */
function levelOf(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return ((Math.abs(h) % 10) + 1);
}
function avatarChar(name) { return (name || "?").charAt(0).toUpperCase(); }
const CROWN_ICON = "👑";

/* ============ 身份 ============ */
function initIdentity() {
  if (!nickname) { location.replace("login.html"); return; }
  document.getElementById("nickLabel").textContent = nickname;
  document.getElementById("logout").addEventListener("click", () => {
    localStorage.removeItem(NICK_KEY);
    sessionStorage.removeItem(ROOM_KEY);
    location.replace("login.html");
  });
  SB.rpc("is_admin", { p_nickname: nickname }).then(is => {
    document.getElementById("adminBtn").style.display = is ? "" : "none";
  }).catch(() => {});
}

/* ============ 大厅视图 ============ */
function showLobby() {
  document.getElementById("lobbyView").style.display = "";
  document.getElementById("roomView").style.display = "none";
  stopPoll();
}

let mode = 2;
document.querySelectorAll(".chip").forEach(c => {
  c.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
    c.classList.add("active");
    mode = parseInt(c.dataset.n, 10);
  });
});

document.getElementById("createBtn").addEventListener("click", async () => {
  setBusy("createBtn", true, "创建中…");
  try {
    const room = await SB.rpc("create_room", { p_max_players: mode, p_nickname: nickname, p_level: levelOf(nickname) });
    enterRoom(room);
    toast("房间创建成功：" + room.room_code, "ok");
  } catch (e) { toast(e.message, "err"); }
  setBusy("createBtn", false, "创建房间");
});

document.getElementById("joinBtn").addEventListener("click", async () => {
  const code = (document.getElementById("joinCode").value || "").trim().toUpperCase();
  if (!/^[A-Z0-9]{6}$/.test(code)) { toast("请输入 6 位房间号", "err"); return; }
  setBusy("joinBtn", true, "加入中…");
  try {
    const room = await SB.rpc("join_room", { p_room_code: code, p_nickname: nickname, p_level: levelOf(nickname) });
    enterRoom(room);
    toast("已加入房间", "ok");
  } catch (e) { toast(e.message, "err"); }
  setBusy("joinBtn", false, "加入房间");
});

function setBusy(id, busy, label) {
  const b = document.getElementById(id);
  b.disabled = busy;
  b.innerHTML = busy ? '<span class="spin"></span> ' + label : label;
}

/* ============ 房间视图 ============ */
function enterRoom(room) {
  roomCode = room.room_code;
  sessionStorage.setItem(ROOM_KEY, roomCode);
  document.getElementById("lobbyView").style.display = "none";
  document.getElementById("roomView").style.display = "";
  document.getElementById("roomCode").textContent = roomCode;
  refreshRoom(room);
  startPoll();
}

function refreshRoom(room) {
  if (!room) return;
  const players = room.players || [];
  const maxN = room.max_players;
  mySeat = -1;
  for (let i = 0; i < players.length; i++) {
    if (players[i].nickname === nickname) { mySeat = i; break; }
  }
  const me = players.find(p => p.nickname === nickname) || null;
  const host = players.find(p => p.is_host) || null;

  const statusEl = document.getElementById("roomStatus");
  if (room.status === "ended") statusEl.textContent = "本局已结束";
  else if (room.status === "playing") statusEl.textContent = "对局进行中…";
  else statusEl.textContent = players.length + "/" + maxN + " 人已就位";

  /* 座位渲染 */
  const seatsEl = document.getElementById("seats");
  seatsEl.innerHTML = "";
  for (let i = 0; i < maxN; i++) {
    const p = players.find(x => x.seat === i) || null;
    const div = document.createElement("div");
    div.className = "seat" + (p && p.nickname === nickname ? " you" : "");
    if (!p) {
      div.innerHTML = '<div class="avatar avatar-empty"><span class="plus">+</span></div><div class="name muted">等待加入</div>';
    } else {
      const lv = p.level || levelOf(p.nickname);
      const isHost = !!p.is_host;
      div.innerHTML =
        '<div class="avatar"><span class="crown crown-lv' + lv + '">' + CROWN_ICON + '</span>' +
        '<span>' + avatarChar(p.nickname) + '</span>' +
        '<span class="lv' + (lv >= 8 ? " lv-gold" : "") + '">Lv.' + lv + '</span>' +
        (isHost ? '<span class="host-tag">👑</span>' : '') +
        (p.nickname === nickname ? '' : '') +
        '</div>' +
        '<div class="name">' + escapeHtml(p.nickname) + (p.nickname === nickname ? ' <span class="you-tag">(你)</span>' : '') + '</div>';
    }
    seatsEl.appendChild(div);
  }

  /* 房主且满员 → 开始游戏；满员未满员提示 */
  const startBtn = document.getElementById("startBtn");
  const waitHint = document.getElementById("waitHint");
  if (room.status === "waiting" && me && me.is_host && players.length === maxN) {
    startBtn.style.display = "";
    waitHint.style.display = "none";
  } else if (room.status === "waiting") {
    startBtn.style.display = "none";
    waitHint.style.display = "";
  } else {
    startBtn.style.display = "none";
    waitHint.style.display = "none";
  }

  /* 对局开始 → 进入斗地主页 */
  if (room.status === "playing") {
    stopPoll();
    location.href = "games/doudizhu.html?room=" + encodeURIComponent(roomCode) + "&nick=" + encodeURIComponent(nickname);
  }
  /* 对局结束 → 回到等待，可重开 */
  if (room.status === "ended" && me && me.is_host) {
    startBtn.style.display = "";
    startBtn.textContent = "再来一局";
    waitHint.style.display = "none";
    startBtn.onclick = startGame;
    return;
  }
  startBtn.onclick = startGame;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function startGame() {
  try {
    const room = await SB.rpc("start_game", { p_room_code: roomCode, p_nickname: nickname });
    refreshRoom(room);
  } catch (e) { toast(e.message, "err"); }
}

document.getElementById("leaveBtn").addEventListener("click", async () => {
  try {
    await SB.rpc("leave_room", { p_room_code: roomCode, p_nickname: nickname });
  } catch (e) { /* 房间可能已销毁 */ }
  sessionStorage.removeItem(ROOM_KEY);
  roomCode = "";
  showLobby();
  toast("已退出房间");
});

/* 轮询房间状态 */
function startPoll() {
  stopPoll();
  pollTimer = setInterval(async () => {
    if (!roomCode) return;
    try {
      const room = await SB.rpc("get_room", { p_room_code: roomCode });
      if (!room) { sessionStorage.removeItem(ROOM_KEY); roomCode = ""; showLobby(); toast("房间已解散", "err"); return; }
      refreshRoom(room);
    } catch (e) {}
  }, 1600);
}
function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

/* ============ 玩法入口 ============ */
document.getElementById("tileDoudizhu").addEventListener("click", () => {
  document.getElementById("createCard").scrollIntoView({ behavior: "smooth" });
});
document.getElementById("tileStory").addEventListener("click", () => {
  location.href = "games/story.html";
});

/* ============ 启动 ============ */
initIdentity();
if (roomCode) {
  SB.rpc("get_room", { p_room_code: roomCode }).then(room => {
    if (room) enterRoom(room);
    else { sessionStorage.removeItem(ROOM_KEY); roomCode = ""; showLobby(); }
  }).catch(() => { sessionStorage.removeItem(ROOM_KEY); roomCode = ""; showLobby(); });
} else {
  showLobby();
}
</script>
</body>
</html>
