<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SAMARRA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      background: #0b1120;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(96,165,250,0.22), transparent 42%),
        radial-gradient(circle at 85% 75%, rgba(167,139,250,0.22), transparent 42%),
        radial-gradient(circle at 50% 110%, rgba(56,189,248,0.12), transparent 55%);
      color: #e2e8f0;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 4px;
      background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    header p {
      font-size: 12px;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 10vw;
      min-width: 80px;
      max-width: 120px;
    }

    .card {
      width: 100%;
      aspect-ratio: 1.618 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;

      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 8px;

      cursor: pointer;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      border-color: rgba(96, 165, 250, 0.6);
      box-shadow: 0 8px 24px rgba(96, 165, 250, 0.3);
    }

    .card .icon {
      font-size: 22px;
      line-height: 1;
    }

    .card .name {
      position: absolute;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      color: #94a3b8;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .card.disabled {
      cursor: not-allowed;
      pointer-events: none;
    }

    .card.disabled .icon {
      color: #ef4444;
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 11px;
      color: #475569;
      letter-spacing: 0.5px;
      line-height: 1.8;
    }

    footer .brand {
      display: block;
      font-size: 12px;
      color: #64748b;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <header>
    <h1>SAMARRA</h1>
    <p>选一个游戏，和好友一起玩</p>
  </header>

  <div class="list">
    <div class="card" onclick="location.href='chat.html'">
      <span class="icon">💬</span>
      <span class="name">聊天室</span>
    </div>

    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
    <div class="card disabled"><span class="icon">✕</span></div>
  </div>

  <footer>
    <span class="brand">© 2026 SAMARRA</span>
    —— Small x 与 Sean 联合发布
  </footer>

</body>
</html>
