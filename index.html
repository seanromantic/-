<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大厅 · SAMARRA</title>
<link rel="stylesheet" href="shared/common.css">
<style>
  .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; max-width: 760px; margin: 0 auto; }
  .game-tile { text-align: left; cursor: pointer; transition: transform .15s, box-shadow .15s; position: relative; overflow: hidden; }
  .game-tile:hover { transform: translateY(-4px); box-shadow: 0 14px 30px rgba(0,0,0,.12); }
  .game-tile .icon { font-size: 40px; margin-bottom: 10px; }
  .game-tile h3 { font-size: 19px; margin-bottom: 6px; }
  .game-tile p { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .game-tile .tag { position: absolute; top: 14px; right: 14px; font-size: 11px; padding: 2px 10px; border-radius: 999px;
    background: #eef2ff; color: var(--brand); font-weight: 700; }
  .game-tile.soon { opacity: .55; cursor: default; }
  .game-tile.soon:hover { transform: none; box-shadow: none; }
  .hello { text-align: center; margin: 26px 0 22px; }
  .hello h2 { font-size: 22px; }
  .hello p { color: var(--muted); font-size: 14px; margin-top: 6px; }
  @media (max-width: 720px) { .game-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<canvas class="fx-layer" id="fx"></canvas>
<div class="toast-wrap" id="toasts"></div>

<header class="topbar">
  <div class="brand">SAMARRA</div>
  <div class="who">
    <span id="nickLabel">—</span>
    <a class="btn btn-sm btn-ghost" id="adminBtn" href="admin.html" style="display:none">管理后台</a>
    <button class="btn btn-sm btn-ghost" id="logout">退出登录</button>
  </div>
</header>

<div class="container">
  <div class="hello">
    <h2 id="helloTitle">选择一个游戏开始</h2>
    <p>点卡片进入对应游戏，房间号会在游戏内创建或加入</p>
  </div>

  <div class="game-grid">
    <div class="card game-tile" id="tileDoudizhu">
      <span class="tag">HOT</span>
      <div class="icon">🃏</div>
      <h3>斗地主</h3>
      <p>2 人单挑 / 3 人经典 / 4 人两副牌。叫地主、发牌、出牌全自动校验，好友开黑随时开局。</p>
    </div>
    <div class="card game-tile" id="tileStory">
      <div class="icon">📖</div>
      <h3>文字冒险</h3>
      <p>剧情节点选择，存档绑定昵称，换设备同昵称可继续冒险。</p>
    </div>
    <div class="card game-tile soon" id="tileSoon">
      <div class="icon">🎮</div>
      <h3>更多游戏</h3>
      <p>敬请期待，后续会陆续加入新玩法。</p>
    </div>
  </div>
</div>

<script>
/* ============ 轻量 Supabase REST 封装（零外部依赖） ============ */
(function () {
  try {
    const p = new URLSearchParams(location.search);
    if (p.get("sburl")) sessionStorage.setItem("samarra_cfg", JSON.stringify({ url: p.get("sburl"), key: p.get("sbkey") || "test-key" }));
  } catch (e) {}
})();
const SB_CFG = (function () { try { const s = sessionStorage.getItem("samarra_cfg"); return s ? JSON.parse(s) : null; } catch (e) { return null; } })();
const SB = {
  url: (SB_CFG && SB_CFG.url) || "https://djvsugbstenltenktpwv.supabase.co",
  key: (SB_CFG && SB_CFG.key) || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqdnN1Z2JzdGVubHRlbmt0cHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2OTI0MDcsImV4cCI6MjEwNzI2ODQwN30.XMBE7NCridZ34BG7LyRiHQRZP0SkVI209uQhqSgcIAs",
  async rpc(fn, body) {
    const r = await fetch(this.url + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": this.key, "Authorization": "Bearer " + this.key, "Prefer": "return=representation" },
      body: JSON.stringify(body || {})
    });
    if (!r.ok) {
      let t = ""; try { t = (await r.json()).message || ""; } catch (e) {}
      if (!t) { try { t = await r.text(); } catch (e2) {} }
      throw new Error((t || ("HTTP " + r.status)).slice(0, 160));
    }
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  }
};

/* ============ 粒子动效 ============ */
(function () {
  const MAX = 60, BURST = 12;
  const cv = document.getElementById("fx");
  const ctx = cv.getContext("2d");
  let parts = [], W = 0, H = 0;
  function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  resize(); addEventListener("resize", resize);
  addEventListener("click", function (e) {
    for (let i = 0; i < BURST; i++) {
      if (parts.length >= MAX) parts.shift();
      const a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 160;
      parts.push({ x: e.clientX, y: e.clientY, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60,
        life: 1, size: 2 + Math.random() * 3.5,
        color: ["#4f46e5", "#7c3aed", "#f59e0b", "#10b981", "#ef4444"][(Math.random() * 5) | 0] });
    }
  });
  (function loop() {
    ctx.clearRect(0, 0, W, H);
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.x += p.vx * 0.016; p.y += p.vy * 0.016; p.vy += 260 * 0.016; p.life -= 0.025;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  })();
})();

/* ============ 身份与账号 ============ */
const NICK_KEY = "samarra_nickname";
let nickname = (localStorage.getItem(NICK_KEY) || "").trim();

function toast(msg, type) {
  const w = document.getElementById("toasts");
  const t = document.createElement("div");
  t.className = "toast" + (type ? " " + type : "");
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function levelOf(nick) {
  let h = 0;
  for (let i = 0; i < nick.length; i++) h = (h * 31 + nick.charCodeAt(i)) >>> 0;
  return 1 + (h % 10);
}

async function initIdentity() {
  if (!nickname) { location.replace("login.html"); return; }
  document.getElementById("nickLabel").textContent = nickname;
  document.getElementById("helloTitle").textContent = "你好，" + nickname;
  document.getElementById("logout").addEventListener("click", () => {
    localStorage.removeItem(NICK_KEY);
    location.replace("login.html");
  });
  try {
    const ok = await SB.rpc("is_admin", { p_nickname: nickname });
    if (ok) document.getElementById("adminBtn").style.display = "";
  } catch (e) {}
}

/* ============ 游戏入口 ============ */
document.getElementById("tileDoudizhu").addEventListener("click", () => {
  location.href = "games/doudizhu-lobby.html";
});
document.getElementById("tileStory").addEventListener("click", () => {
  location.href = "games/story.html";
});
document.getElementById("tileSoon").addEventListener("click", () => {
  toast("更多游戏正在开发中，敬请期待", "err");
});

initIdentity();
</script>
</body>
</html>
