<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SAMARRA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="shared/common.css">
  <style>
    .top-left {
      position: fixed; top: 16px; left: 16px;
      display: flex; align-items: center; gap: 10px; z-index: 10;
    }
    .top-left .nickname {
      font-size: 13px; font-weight: 600; color: #334155;
    }
    .top-right {
      position: fixed; top: 16px; right: 16px;
      display: flex; align-items: center; gap: 8px; z-index: 10;
    }
    .top-right .icon { width: 36px; height: 36px; }
    .top-right a {
      font-size: 12px; color: #5b8cff; text-decoration: none;
      padding: 6px 12px; border: 1px solid #e2e8f0;
      border-radius: 20px; background: #fff;
    }
    .top-right a:hover { background: #eff6ff; }
    .top-right .admin-link { display: none; }
    
    header { text-align: center; margin-top: 60px; margin-bottom: 30px; }
    header .logo-row {
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    header h1 {
      font-size: 30px; font-weight: 800; letter-spacing: 3px; color: #334155;
    }
    header p { font-size: 12px; color: #94a3b8; margin-top: 8px; }
    
    /* 游戏列表容器 */
    .game-list {
      display: flex; flex-direction: column; gap: 12px;
      width: 100%; max-width: 420px; margin: 0 auto;
    }
    
    /* 直接在这里写死游戏卡片的样式，保证绝对能显示 */
    .game-card {
      display: flex; align-items: center; gap: 14px;
      background: #fff; border: 1px solid #e2e8f0;
      border-radius: 999px; padding: 14px 24px;
      cursor: pointer; transition: 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .game-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(91,140,255,0.15);
      border-color: #c7d2fe;
    }
    .game-card .hex { font-size: 22px; line-height: 1; }
    .game-card .label {
      font-size: 15px; font-weight: 600; color: #1e293b;
    }
    .game-card.disabled {
      cursor: not-allowed; pointer-events: none; opacity: 0.45;
    }
  </style>
</head>
<body>

  <div class="top-left">
    <div id="myAvatar"></div>
    <span class="nickname" id="myNickname">加载中...</span>
  </div>

  <div class="top-right">
    <svg class="icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#a5b4fc" stroke-width="3.5" stroke-linecap="round">
        <line x1="12" y1="12" x2="28" y2="28" />
        <line x1="28" y1="12" x2="12" y2="28" />
      </g>
      <defs>
        <linearGradient id="gradX" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#5b8cff" />
          <stop offset="100%" stop-color="#8e6bff" />
        </linearGradient>
      </defs>
      <g stroke="url(#gradX)" stroke-width="3.5" stroke-linecap="round">
        <line x1="16" y1="10" x2="32" y2="26" />
        <line x1="32" y1="10" x2="16" y2="26" />
      </g>
    </svg>
    <a href="admin.html" class="admin-link" id="adminLink">管理</a>
    <a href="javascript:User.logout()">返回登录</a>
  </div>

  <header>
    <div class="logo-row anim-down">
      <svg width="36" height="36" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#a5b4fc" stroke-width="3.5" stroke-linecap="round">
          <line x1="12" y1="12" x2="28" y2="28" />
          <line x1="28" y1="12" x2="12" y2="28" />
        </g>
        <g stroke="url(#gradX)" stroke-width="3.5" stroke-linecap="round">
          <line x1="16" y1="10" x2="32" y2="26" />
          <line x1="32" y1="10" x2="16" y2="26" />
        </g>
      </svg>
      <h1>SAMARRA</h1>
    </div>
    <p>选一个游戏，和朋友一起玩</p>
  </header>

  <!-- 游戏列表直接写死，不再依赖 JS 动态渲染 -->
  <div class="game-list">
    
    <div class="game-card anim-up anim-delay-1" onclick="location.href='games/chat.html'">
      <span class="hex">💬</span>
      <span class="label">聊天室</span>
    </div>

    <div class="game-card anim-up anim-delay-2" onclick="location.href='games/doudizhu.html'">
      <span class="hex">🃏</span>
      <span class="label">斗地主</span>
    </div>

    <div class="game-card anim-up anim-delay-3" onclick="location.href='games/magnet.html'">
      <span class="hex">🧲</span>
      <span class="label">磁铁对战</span>
    </div>

    <div class="game-card disabled anim-up anim-delay-4">
      <span class="hex">⭕</span>
      <span class="label">五子棋 · 即将上线</span>
    </div>

    <div class="game-card disabled anim-up anim-delay-5">
      <span class="hex">♟️</span>
      <span class="label">象棋 · 即将上线</span>
    </div>

  </div>

  <!-- 只需要引入配置和用户模块，不再需要 games.js 和 ui.js 来渲染列表了 -->
  <script src="shared/config.js"></script>
  <script src="shared/user.js"></script>
  <script src="shared/ui.js"></script>
  <script>
    window.onload = function() {
      // 1. 检查登录
      if (!User.isLoggedIn()) {
        location.replace('login.html');
        return;
      }

      // 2. 渲染用户信息（头像和昵称）
      // 注意：这里调用了 ui.js 里的 renderAvatar，只要你那个函数没删就行
if (typeof UI !== 'undefined' && UI.renderAvatar) {
        UI.renderAvatar(document.getElementById('myAvatar'), 'sm');
      }
      document.getElementById('myNickname').innerText = User.getNickname();

      // 3. 管理员入口
      if (User.isAdmin()) {
        document.getElementById('adminLink').style.display = 'inline-block';
      }

      // 4. 签到天数
      User.checkDailyLogin();
    };
  </script>
</body>
</html>
