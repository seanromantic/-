    localStorage.removeItem('samarra_login_time');
    location.replace('login.html');

})();

/* ============ 轻量 Supabase REST 封装（零外部依赖） ============ */
(function () {
  try {
    const p = new URLSearchParams(location.search);
    if (p.get("sburl")) sessionStorage.setItem("samarra_cfg", JSON.stringify({ url: p.get("sburl"), key: p.get("sbkey") || "test-key" }));
  } catch (e) {}
})();
const SB_CFG = (function () { try { const s = sessionStorage.getItem("samarra_cfg"); return s ? JSON.parse(s) : null; } catch (e) { return null; } })();
const SB = {
  url: (SB_CFG && SB_CFG.url) || "https://djvsugbstenltenktpwv.supabase.co",
  key: (SB_CFG && SB_CFG.key) || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqdnN1Z2JzdGVubHRlbmt0cHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2OTI0MDcsImV4cCI6MjEwNzI2ODQwN30.XMBE7NCridZ34BG7LyRiHQRZP0SkVI209uQhqSgcIAs",
  async rpc(fn, body) {
    const r = await fetch(this.url + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": this.key, "Authorization": "Bearer " + this.key, "Prefer": "return=representation" },
      body: JSON.stringify(body || {})
    });
    if (!r.ok) {
      let t = ""; try { t = (await r.json()).message || ""; } catch (e) {}
      if (!t) { try { t = await r.text(); } catch (e2) {} }
      throw new Error((t || ("HTTP " + r.status)).slice(0, 160));
    }
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  }
};

/* ============ 粒子动效 ============ */
(function () {
  const MAX = 60, BURST = 12;
  const cv = document.getElementById("fx");
  const ctx = cv.getContext("2d");
  let parts = [], W = 0, H = 0;
  function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  resize(); addEventListener("resize", resize);
  addEventListener("click", function (e) {
    for (let i = 0; i < BURST; i++) {
      if (parts.length >= MAX) parts.shift();
      const a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 160;
      parts.push({ x: e.clientX, y: e.clientY, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60,
        life: 1, size: 2 + Math.random() * 3.5,
        color: ["#4f46e5", "#7c3aed", "#f59e0b", "#10b981", "#ef4444"][(Math.random() * 5) | 0] });
    }
  });
  (function loop() {
    ctx.clearRect(0, 0, W, H);
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.x += p.vx * 0.016; p.y += p.vy * 0.016; p.vy += 260 * 0.016; p.life -= 0.025;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  })();
})();

/* ============ 身份与账号 ============ */
const NICK_KEY = "samarra_nickname";
let nickname = (localStorage.getItem(NICK_KEY) || "").trim();
/* 立即显示昵称头像，不等任何异步 */
if (nickname) {
  document.getElementById("nickLabel").textContent = nickname;
  document.getElementById("myAvatarChar").textContent = nickname[0].toUpperCase();
}

function toast(msg, type) {
  const w = document.getElementById("toasts");
  const t = document.createElement("div");
  t.className = "toast" + (type ? " " + type : "");
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function levelOf(nick) {
  let h = 0;
  for (let i = 0; i < nick.length; i++) h = (h * 31 + nick.charCodeAt(i)) >>> 0;
  return 1 + (h % 10);
}

async function initIdentity() {
  if (!nickname) { location.replace("login.html"); return; }
  /* 第一步：立即显示昵称头像 */
  document.getElementById("nickLabel").textContent = nickname;
  document.getElementById("myAvatarChar").textContent = nickname[0].toUpperCase();
  document.getElementById("myLevel").textContent = "Lv.MAX";

  /* 第二步：立即绑定按钮事件（不等 Supabase） */
  document.getElementById("mailBtn").addEventListener("click", openMailModal);
  document.getElementById("friendBtn").addEventListener("click", openFriendDrawer);
  document.getElementById("settingsBtn").addEventListener("click", e => {
    e.stopPropagation();
    const m = document.getElementById("settingsMenu");
    m.style.display = m.style.display === "none" ? "block" : "none";
  });
  document.addEventListener("click", () => { document.getElementById("settingsMenu").style.display = "none"; });
  document.querySelectorAll(".menu-item").forEach(item => {
    item.addEventListener("click", () => {
      const act = item.dataset.action;
      if (act === "logout") { localStorage.removeItem(NICK_KEY); localStorage.removeItem("samarra_login_time"); location.replace("login.html"); }
      if (act === "admin") location.href = "admin.html";
    });
  });
  document.getElementById("myAvatar").addEventListener("click", () => openProfileModal(nickname));

  /* 第三步：等 Supabase 就绪后拉数据 */
  let waitCount = 0;
  while (typeof SB === 'undefined' || !SB.rpc) {
    await new Promise(r => setTimeout(r, 100));
    waitCount++;
    if (waitCount > 20) break;
  }
  try {
    const ok = await SB.rpc("is_admin", { p_nickname: nickname });
    if (ok) {
      document.getElementById("adminMenuItem").style.display = "";
      document.getElementById("adminMenuItem").textContent = nickname === "Sean" ? "🛠 超管后台" : "🛠 管理后台";
    }
  } catch (e) {}
  /* 查资料：等级 + SVIP */
  try {
    const prof = await SB.rpc("get_profile", { p_nickname: nickname });
    if (prof) {
      document.getElementById("myLevel").textContent = "Lv." + (prof.level >= 10 ? "MAX" : prof.level);
      if (prof.vip_type >= 2) document.getElementById("myVipBadge").style.display = "flex";
      if (prof.vip_type >= 2) {
        document.getElementById("svipName").textContent = nickname;
        document.getElementById("svipBanner").style.display = "";
        setTimeout(() => { document.getElementById("svipBanner").style.display = "none"; }, 5000);
      }
    }
  } catch (e) {}
  loadMails();
}

async function loadMails() {
  try {
    const mails = await SB.rpc("list_my_mails", { p_nickname: nickname }) || [];
    const unread = mails.filter(m => !m.claimed).length;
    const badge = document.getElementById("mailBadge");
    if (unread > 0) { badge.style.display = ""; badge.textContent = unread; }
    else badge.style.display = "none";
    window._mails = mails;
  } catch (e) {}
}

async function openMailModal() {
  let mails = window._mails || [];
  const list = mails.map(m =>
    '<div style="padding:12px;border-bottom:1px solid #eee">' +
      '<div style="font-weight:700">' + escapeHtml(m.title) + '</div>' +
      '<div style="font-size:13px;color:#666;margin:4px 0">' + escapeHtml(m.content) + '</div>' +
      (m.reward_minutes > 0 ? '<div style="font-size:12px;color:#10b981">🎁 经验 +' + m.reward_minutes + ' 分钟</div>' : '') +
      (m.reward_vip_days > 0 ? '<div style="font-size:12px;color:#7c3aed">💎 SVIP 体验 ' + m.reward_vip_days + ' 天</div>' : '') +
      (m.claimed ? '<div style="font-size:12px;color:#999;margin-top:4px">已领取</div>'
        : '<button class="btn btn-sm btn-primary" data-claim="' + m.id + '" style="margin-top:6px">领取奖励</button>') +
    '</div>'
  ).join("");
  const html = '<div style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center" onclick="if(event.target===this)this.remove()">' +
    '<div class="card" style="width:90%;max-width:420px;max-height:80vh;overflow-y:auto">' +
      '<h3 style="margin-bottom:10px">📬 我的邮件</h3>' +
      (list || '<div class="muted" style="text-align:center;padding:20px">暂无邮件</div>') +
    '</div></div>';
  const div = document.createElement("div");
  div.innerHTML = html;
  document.body.appendChild(div.firstChild);
  div.querySelectorAll("[data-claim]").forEach(btn => {
    btn.addEventListener("click", async () => {
      try {
        await SB.rpc("claim_mail", { p_nickname: nickname, p_mail_id: parseInt(btn.dataset.claim) });
        toast("领取成功！", "ok");
        div.remove();
        loadMails();
      } catch (e) { toast(e.message, "err"); }
    });
  });
}

async function loadLeaderboard(type) {
  try {
    const rows = await SB.rpc("leaderboard", { p_type: type }) || [];
    if (!rows.length) return '<div class="muted" style="text-align:center;padding:10px">暂无数据</div>';
    return rows.map((r, i) => {
      const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i + 1);
      const vip = r.vip_type >= 2 ? "💎" : r.vip_type >= 1 ? "👑" : "";
      return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f3f4f6">' +
        '<span style="width:28px;text-align:center;font-weight:800">' + medal + '</span>' +
        '<span style="flex:1;font-weight:600">' + escapeHtml(r.nickname) + ' ' + vip + '</span>' +
        '<span class="muted" style="font-size:12px">Lv.' + (r.level >= 10 ? "MAX" : r.level) + ' · ' + r.minutes + '分</span>' +
      '</div>';
    }).join("");
  } catch (e) { return '<div class="muted">加载失败</div>'; }
}

      '<button class="btn btn-sm btn-ghost" id="rTB">在线榜</button>' +
    '</div>' +
    '<div id="rBox"></div>' +
  '</div>';

  show("level");
  div.querySelector("#rLB").onclick = () => show("level");
  div.querySelector("#rTB").onclick = () => show("time");
}

      ? friends.map(f => '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f3f4f6">' +
          '<span style="width:32px;height:32px;border-radius:50%;background:#6366f1;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">' + escapeHtml(f.nickname[0].toUpperCase()) + '</span>' +
          '<span style="flex:1;font-weight:600">' + escapeHtml(f.nickname) + ' ' + (f.vip_type >= 2 ? '💎' : f.vip_type >= 1 ? '👑' : '') + '</span>' +
          '<span class="muted" style="font-size:12px">Lv.' + (f.level >= 10 ? "MAX" : f.level) + '</span>' +
        '</div>').join("")
      : '<div class="muted" style="text-align:center;padding:20px">还没有好友</div>';
  } catch (e) {}
  try {
    const reqs = await SB.rpc("list_friend_requests", { p_nickname: nickname }) || [];
    div.querySelector("#reqList").innerHTML = reqs.length
      ? reqs.map(r => '<div style="display:flex;align-items:center;gap:8px;padding:6px 0">' +
          '<span style="flex:1;font-size:13px">💌 ' + escapeHtml(r.nickname) + ' 请求加你</span>' +
          '<button class="btn btn-sm btn-primary" data-accept="' + escapeHtml(r.nickname) + '">同意</button>' +
        '</div>').join("")
      : '<div class="muted" style="font-size:13px">暂无新请求</div>';
    div.querySelectorAll("[data-accept]").forEach(b => b.onclick = async () => {
      await SB.rpc("accept_friend", { p_nickname: nickname, p_friend: b.dataset.accept });
      toast("已添加好友", "ok");
      div.remove();
    });
  } catch (e) {}
}

/* ============ 个人主页弹窗 ============ */
async function openProfileModal(pNick) {
  const div = document.createElement("div");
  div.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center";
  div.onclick = e => { if (e.target === div) div.remove(); };
  div.innerHTML = '<div class="card" style="width:380px;max-width:90vw;text-align:center;padding:30px;position:relative">' +
    '<button style="position:absolute;top:12px;right:16px;border:none;background:none;font-size:20px;cursor:pointer;color:#999" onclick="this.closest(\'.card\').parentElement.remove()">×</button>' +
    '<div style="width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;margin:0 auto 12px;position:relative">' +
      '<span>' + escapeHtml(pNick[0].toUpperCase()) + '</span>' +
      '<span id="pCrown" style="position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:28px;display:none">👑</span>' +
      '<span id="pVip" style="position:absolute;bottom:-4px;right:-4px;width:28px;height:28px;border-radius:50%;background:#111;color:#ffd700;font-size:11px;display:none;align-items:center;justify-content:center;border:3px solid #fff;font-weight:900">SV</span>' +
    '</div>' +
    '<h2 style="margin-bottom:4px">' + escapeHtml(pNick) + '</h2>' +
    '<div id="pLevel" class="muted" style="font-size:13px;margin-bottom:16px">Lv.1</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">' +
      '<div style="background:#f8f9ff;border-radius:12px;padding:12px"><div style="font-size:20px;font-weight:900;color:#4f46e5">—</div><div class="muted" style="font-size:12px">斗地主胜场</div></div>' +
      '<div style="background:#f8f9ff;border-radius:12px;padding:12px"><div style="font-size:20px;font-weight:900;color:#7c3aed" id="pMinutes">0</div><div class="muted" style="font-size:12px">在线分钟</div></div>' +
    '</div>' +
    '<div id="pActions" style="display:flex;gap:8px;justify-content:center"></div>' +
  '</div>';
  document.body.appendChild(div);
  try {
    const prof = await SB.rpc("get_profile", { p_nickname: pNick });
    if (prof) {
      div.querySelector("#pLevel").textContent = "Lv." + (prof.level >= 10 ? "MAX" : prof.level);
      div.querySelector("#pMinutes").textContent = prof.minutes || 0;
      if (prof.level >= 10) div.querySelector("#pCrown").style.display = "block";
      if (prof.vip_type >= 2) div.querySelector("#pVip").style.display = "flex";
    }
  } catch (e) {}
  const actions = div.querySelector("#pActions");
  if (pNick === nickname) {
    actions.innerHTML = '<button class="btn btn-ghost" onclick="this.closest(\'.card\').parentElement.remove()">关闭</button>';
  } else {
    actions.innerHTML =
      '<button class="btn btn-primary" id="pAddFriend">➕ 加好友</button>' +
      (nickname === "Sean" ? '<button class="btn btn-ghost" onclick="location.href=\'admin.html\'">🛠 管理该用户</button>' : '');
    const bf = actions.querySelector("#pAddFriend");
    if (bf) bf.onclick = async () => {
      await SB.rpc("add_friend", { p_nickname: nickname, p_friend: pNick });
      toast("好友请求已发送", "ok");
    };
  }
}

/* 页面加载完立即执行 */
initIdentity();
</script>
