<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>联机聊天室</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 10px; }
    #status { color: #888; }
    #messages { list-style: none; padding: 0; min-height: 200px; border: 1px solid #ddd; border-radius: 8px; padding: 10px; }
    #messages li { margin-bottom: 10px; }
    .input-bar { display: flex; gap: 8px; margin-top: 10px; }
    input { flex: 1; padding: 8px; }
    button { padding: 8px 16px; }
  </style>
</head>
<body>
  <h2>联机聊天室</h2>
  <p id="status">连接中...</p>
  <ul id="messages"></ul>
  <div class="input-bar">
    <input id="msg" placeholder="说点什么..." />
    <button onclick="sendMsg()">发送</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://djvsugbstenltenktpwv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqdnN1Z2JzdGVubHRlbmt0cHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2OTI0MDcsImV4cCI6MjEwNzI2ODQwN30.XMBE7NCridZ34BG7LyRiHQRZP0SkVI209uQhqSgcIAs';

    const myName = '玩家' + Math.floor(Math.random() * 9000 + 1000);

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const channel = client.channel('chat-room', {
      config: { broadcast: { self: true, ack: true } }
    });

    // 1. 先读历史消息
    async function loadHistory() {
      const { data, error } = await client
        .from('messages')
        .select('*')
        .order('created_at', { ascending: true })
        .limit(50);

      if (error) {
        document.getElementById('status').innerText = '读取历史失败：' + error.message;
        return;
      }
      data.forEach((msg) => addMessage(msg.name, msg.text));
    }

    // 2. 订阅新消息
    channel
      .on('broadcast', { event: 'chat' }, (payload) => {
        const data = payload.payload;
        addMessage(data.name, data.text);
      })
      .subscribe((status) => {
        document.getElementById('status').innerText =
          status === 'SUBSCRIBED' ? '已连接' : '状态：' + status;
      });

    // 3. 显示消息
    function addMessage(name, text) {
      const li = document.createElement('li');
      li.innerText = name + '：' + text;
      document.getElementById('messages').appendChild(li);
      window.scrollTo(0, document.body.scrollHeight);
    }

    // 4. 发消息：先存数据库，再广播
    async function sendMsg() {
      const text = document.getElementById('msg').value;
      if (!text) return;

      // 本地先显示
      addMessage(myName + '（我）', text);

      // 存进数据库（这样离线的人也能看到历史）
      await client.from('messages').insert({ name: myName, text: text });

      // 广播给此刻在线的人（实时显示）
      channel.send({
        type: 'broadcast',
        event: 'chat',
        payload: { name: myName, text: text }
      });

      document.getElementById('msg').value = '';
    }

    document.getElementById('msg').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendMsg();
    });

    // 页面加载时，先读历史
    loadHistory();
  </script>
</body>
</html>
