<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>斗地主 · SAMARRA</title>
<link rel="stylesheet" href="../shared/common.css">
<style>
  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px;
    text-decoration: none; margin-bottom: 16px; }
  .back-link:hover { color: var(--brand); }
  .lobby-view { max-width: 600px; margin: 0 auto; }
  .room-view { max-width: 640px; margin: 0 auto; }
</style>
</head>
<body>
<canvas class="fx-layer" id="fx"></canvas>
<div class="toast-wrap" id="toasts"></div>

<header class="topbar">
  <div class="brand">🃏 斗地主</div>
  <div class="who">
    <span id="nickLabel">—</span>
    <a class="btn btn-sm btn-ghost" href="../index.html">返回大厅</a>
  </div>
</header>

<div class="container">
  <a class="back-link" href="../index.html">← 返回游戏大厅</a>

  <!-- 视图一：创建 / 加入房间 -->
  <section id="lobbyView" class="lobby-view">
    <div class="card" id="createCard">
      <h3 style="margin-bottom:14px">创建斗地主房间</h3>
      <div class="field">
        <label>人数模式</label>
        <div class="chip-group">
          <div class="chip active" data-n="2">👥 2 人单挑</div>
          <div class="chip" data-n="3">🃏 3 人经典</div>
          <div class="chip" data-n="4">🃏🃏 4 人两副牌</div>
        </div>
      </div>
      <button class="btn btn-primary btn-lg" id="createBtn" style="width:100%">创建房间</button>
    </div>

    <div class="card mt-16">
      <h3 style="margin-bottom:14px">加入房间</h3>
      <div class="field">
        <label>房间号</label>
        <input class="input" id="joinCode" maxlength="6" placeholder="输入 6 位房间号" autocomplete="off" style="text-transform:uppercase">
      </div>
      <button class="btn btn-lg" id="joinBtn" style="width:100%">加入房间</button>
    </div>
  </section>

  <!-- 视图二：房间内等待 -->
  <section id="roomView" class="room-view" style="display:none">
    <div class="row-between card" style="margin-bottom:18px">
      <div>
        <div class="room-code-big" id="roomCode">——</div>
        <div class="copy-hint">把房间号发给朋友加入</div>
      </div>
      <div id="roomStatus" class="muted" style="font-weight:700">等待加入…</div>
    </div>

    <div class="card">
      <div class="seats" id="seats"></div>
      <div class="row-between" style="margin-top:8px">
        <button class="btn btn-danger" id="leaveBtn">退出房间</button>
        <button class="btn btn-ok btn-lg" id="startBtn" style="display:none">开始游戏</button>
        <div class="muted" id="waitHint" style="display:none">等待房主开始游戏…</div>
      </div>
    </div>
  </section>
</div>

<script>
/* ============ Supabase 封装 ============ */
const SB = {
  url: "https://djvsugbstenltenktpwv.supabase.co",
  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqdnN1Z2JzdGVubHRlbmt0cHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2OTI0MDcsImV4cCI6MjEwNzI2ODQwN30.XMBE7NCridZ34BG7LyRiHQRZP0SkVI209uQhqSgcIAs",
  async rpc(fn, body) {
    const r = await fetch(this.url + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": this.key, "Authorization": "Bearer " + this.key, "Prefer": "return=representation" },
      body: JSON.stringify(body || {})
    });
    if (!r.ok) {
      let t = ""; try { t = (await r.json()).message || ""; } catch (e) {}
      if (!t) { try { t = await r.text(); } catch (e2) {} }
      throw new Error((t || ("HTTP " + r.status)).slice(0, 160));
    }
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  }
};

/* ============ 粒子 ============ */
(function () {
  const MAX = 60, BURST = 12;
  const cv = document.getElementById("fx");
  const ctx = cv.getContext("2d");
  let parts = [], W = 0, H = 0;
  function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  resize(); addEventListener("resize", resize);
  addEventListener("click", function (e) {
    for (let i = 0; i < BURST; i++) {
      if (parts.length >= MAX) parts.shift();
      const a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 160;
      parts.push({ x: e.clientX, y: e.clientY, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60,
        life: 1, size: 2 + Math.random() * 3.5,
        color: ["#4f46e5", "#7c3aed", "#f59e0b", "#10b981", "#ef4444"][(Math.random() * 5) | 0] });
    }
  });
  (function loop() {
    ctx.clearRect(0, 0, W, H);
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.x += p.vx * 0.016; p.y += p.vy * 0.016; p.vy += 260 * 0.016; p.life -= 0.025;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  })();
})();

/* ============ 身份 ============ */
const NICK_KEY = "samarra_nickname";
const ROOM_KEY = "samarra_room";
let nickname = (localStorage.getItem(NICK_KEY) || "").trim();
let roomCode = sessionStorage.getItem(ROOM_KEY) || "";
let mySeat = -1, pollTimer = null;

const CROWN_ICON = "👑";

function toast(msg, type) {
  const w = document.getElementById("toasts");
  const t = document.createElement("div");
  t.className = "toast" + (type ? " " + type : "");
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function levelOf(nick) {
  let h = 0;
  for (let i = 0; i < nick.length; i++) h = (h * 31 + nick.charCodeAt(i)) >>> 0;
  return 1 + (h % 10);
}
function avatarChar(nick) { return escapeHtml((nick || "?").slice(0, 1).toUpperCase()); }

/* ============ 视图切换 ============ */
function showLobby() {
  document.getElementById("lobbyView").style.display = "block";
  document.getElementById("roomView").style.display = "none";
  stopPoll();
}

let mode = 2;
document.querySelectorAll(".chip").forEach(c => {
  c.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
    c.classList.add("active");
    mode = parseInt(c.dataset.n, 10);
  });
});

document.getElementById("createBtn").addEventListener("click", async () => {
  setBusy("createBtn", true, "创建中…");
  try {
    const room = await SB.rpc("create_room", { p_max_players: mode, p_nickname: nickname, p_level: levelOf(nickname) });
    enterRoom(room);
    toast("房间创建成功：" + room.room_code, "ok");
  } catch (e) { toast(e.message, "err"); }
  setBusy("createBtn", false, "创建房间");
});

document.getElementById("joinBtn").addEventListener("click", async () => {
  const code = (document.getElementById("joinCode").value || "").trim().toUpperCase();
  if (!/^[A-Z0-9]{6}$/.test(code)) { toast("请输入 6 位房间号", "err"); return; }
  setBusy("joinBtn", true, "加入中…");
  try {
    const room = await SB.rpc("join_room", { p_room_code: code, p_nickname: nickname, p_level: levelOf(nickname) });
    enterRoom(room);
    toast("已加入房间", "ok");
  } catch (e) { toast(e.message, "err"); }
  setBusy("joinBtn", false, "加入房间");
});

function setBusy(id, busy, label) {
  const b = document.getElementById(id);
  b.disabled = busy;
  b.innerHTML = busy ? '<span class="spin"></span> ' + label : label;
}

/* ============ 用户资料（等级/VIP） ============ */
const profileCache = {};
async function getProfile(nick) {
  if (profileCache[nick]) return profileCache[nick];
  try {
    let r = await SB.rpc("get_user_profile", { p_nickname: nick });
    if (Array.isArray(r)) r = r[0];
    profileCache[nick] = { level: r.level, vip_type: r.vip_type, minutes: r.minutes };
  } catch (e) {
    profileCache[nick] = { level: 1, vip_type: 0, minutes: 0 };
  }
  return profileCache[nick];
}

/* ============ 心跳：每分钟累计在线时长 ============ */
setInterval(() => {
  if (nickname && nickname !== "Sean") {
    SB.rpc("tick_minute", { p_nickname: nickname }).catch(() => {});
  }
}, 60000);

/* ============ 房间视图 ============ */
function enterRoom(room) {
  roomCode = room.room_code;
  sessionStorage.setItem(ROOM_KEY, roomCode);
  document.getElementById("lobbyView").style.display = "none";
  document.getElementById("roomView").style.display = "block";
  document.getElementById("roomCode").textContent = roomCode;
  refreshRoom(room);
  startPoll();
}

async function refreshRoom(room) {
  if (!room) return;
  const players = room.players || [];
  const maxN = room.max_players;
  mySeat = -1;
  for (let i = 0; i < players.length; i++) {
    if (players[i].nickname === nickname) { mySeat = i; break; }
  }
  const me = players.find(p => p.nickname === nickname) || null;

  const statusEl = document.getElementById("roomStatus");
  if (room.status === "ended") statusEl.textContent = "本局已结束";
  else if (room.status === "playing") statusEl.textContent = "对局进行中…";
  else statusEl.textContent = players.length + "/" + maxN + " 人已就位";

  /* 拉取所有玩家资料 */
  const profiles = {};
  await Promise.all(players.map(async p => { profiles[p.nickname] = await getProfile(p.nickname); }));

  const seatsEl = document.getElementById("seats");
  seatsEl.innerHTML = "";
  for (let i = 0; i < maxN; i++) {
    const p = players.find(x => x.seat === i) || null;
    const div = document.createElement("div");
    div.className = "seat" + (p && p.nickname === nickname ? " you" : "");
    if (!p) {
      div.innerHTML = '<div class="avatar avatar-empty"><span class="plus">+</span></div><div class="name muted">等待加入</div>';
    } else {
      const prof = profiles[p.nickname] || { level: 1, vip_type: 0 };
      const lv = prof.level;
      const vt = prof.vip_type;
      const isHost = !!p.is_host;
      const badgeHtml = vt >= 1
        ? '<span class="vip-badge ' + (vt >= 2 ? 'svip' : 'vip') + '" data-nick="' + escapeHtml(p.nickname) + '">' + (vt >= 2 ? 'SV' : 'V') + '</span>'
        : '';
      div.innerHTML =
        '<div class="avatar"><span class="crown crown-lv' + lv + '">' + CROWN_ICON + '</span>' +
        '<span>' + avatarChar(p.nickname) + '</span>' + badgeHtml +
        '<span class="lv' + (lv >= 8 ? " lv-gold" : "") + '">Lv.' + (lv >= 10 ? "MAX" : lv) + '</span>' +
        (isHost ? '<span class="host-tag">👑</span>' : '') +
        '</div>' +
        '<div class="name">' + escapeHtml(p.nickname) + (p.nickname === nickname ? ' <span class="you-tag">(你)</span>' : '') + '</div>';
    }
    seatsEl.appendChild(div);
  }

  /* 点击自己头像右下角角标 → 弹 VIP 价目表 */
  seatsEl.querySelectorAll('.vip-badge').forEach(b => {
    if (b.dataset.nick === nickname) b.addEventListener("click", openVipModal);
  });

  const startBtn = document.getElementById("startBtn");
  const waitHint = document.getElementById("waitHint");
  if (room.status === "waiting" && me && me.is_host && players.length === maxN) {
    startBtn.style.display = "";
    waitHint.style.display = "none";
  } else if (room.status === "waiting") {
    startBtn.style.display = "none";
    waitHint.style.display = "";
  } else {
    startBtn.style.display = "none";
    waitHint.style.display = "none";
  }

  if (room.status === "playing") {
    stopPoll();
    location.href = "doudizhu.html?room=" + encodeURIComponent(roomCode) + "&nick=" + encodeURIComponent(nickname);
  }
  if (room.status === "ended" && me && me.is_host) {
    startBtn.style.display = "";
    startBtn.textContent = "再来一局";
    waitHint.style.display = "none";
    startBtn.onclick = startGame;
    return;
  }
  startBtn.onclick = startGame;
}

async function startGame() {
  try {
    const room = await SB.rpc("start_game", { p_room_code: roomCode, p_nickname: nickname });
    refreshRoom(room);
  } catch (e) { toast(e.message, "err"); }
}

document.getElementById("leaveBtn").addEventListener("click", async () => {
  try { await SB.rpc("leave_room", { p_room_code: roomCode, p_nickname: nickname }); } catch (e) {}
  sessionStorage.removeItem(ROOM_KEY);
  roomCode = "";
  showLobby();
  toast("已退出房间");
});

function startPoll() {
  stopPoll();
  pollTimer = setInterval(async () => {
    if (!roomCode) return;
    try {
      const room = await SB.rpc("get_room", { p_room_code: roomCode });
      if (!room) { sessionStorage.removeItem(ROOM_KEY); roomCode = ""; showLobby(); toast("房间已解散", "err"); return; }
      refreshRoom(room);
    } catch (e) {}
  }, 1600);
}
function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

/* ============ VIP 弹窗 ============ */
async function openVipModal() {
  let cfg = { vip_price: "¥25/月", svip_price: "¥68/月", vip_desc: "金框头像 · 专属 V 角标", svip_desc: "流光头像框 · 专属 SV 角标" };
  try {
    let c = await SB.rpc("get_vip_config", {});
    if (Array.isArray(c)) c = c[0];
    if (c) cfg = c;
  } catch (e) {}
  const mask = document.createElement("div");
  mask.className = "vip-modal-mask";
  mask.innerHTML =
    '<div class="vip-modal">' +
    '<span class="close-x" onclick="this.closest(\'.vip-modal-mask\').remove()">×</span>' +
    '<h2>会员特权</h2>' +
    '<div class="sub">尊贵身份，从这里开始</div>' +
    '<div class="vip-tier"><div class="row"><span class="name">👑 VIP</span><span class="price">' + escapeHtml(cfg.vip_price) + '</span></div>' +
    '<div class="desc">' + escapeHtml(cfg.vip_desc) + '</div></div>' +
    '<div class="vip-tier svip"><div class="row"><span class="name">💎 SVIP</span><span class="price">' + escapeHtml(cfg.svip_price) + '</span></div>' +
    '<div class="desc">' + escapeHtml(cfg.svip_desc) + '</div></div>' +
    '<button class="contact-btn" onclick="toast(\'请联系管理员开通：Sean\',\'ok\'); this.closest(\'.vip-modal-mask\').remove()">联系管理员开通</button>' +
    '</div>';
  mask.addEventListener("click", e => { if (e.target === mask) mask.remove(); });
  document.body.appendChild(mask);
}

/* ============ 启动 ============ */
if (!nickname) { location.replace("../login.html"); }
else {
  document.getElementById("nickLabel").textContent = nickname;
  if (roomCode) {
    SB.rpc("get_room", { p_room_code: roomCode }).then(room => {
      if (room) enterRoom(room);
      else { sessionStorage.removeItem(ROOM_KEY); roomCode = ""; showLobby(); }
    }).catch(() => { sessionStorage.removeItem(ROOM_KEY); roomCode = ""; showLobby(); });
  } else {
    showLobby();
  }
}
</script>
</body>
</html>
